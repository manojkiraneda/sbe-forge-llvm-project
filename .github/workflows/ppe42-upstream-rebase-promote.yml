name: Promote PPE42 upstream rebase

on:
  workflow_run:
    workflows: ['PPE42 toolchain']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ppe42-upstream-rebase-controller
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'automation/ppe42-rebase/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.PPE42_REBASE_TOKEN }}
      REPORT: ${{ runner.temp }}/ppe42-promotion
    steps:
      - name: Record failed candidate
        if: github.event.workflow_run.conclusion != 'success'
        env:
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Candidate CI did not succeed: $CI_URL. llvm-next remains unchanged." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@v4
        if: github.event.workflow_run.conclusion == 'success'
        with:
          # Always use the trusted controller, never execute a promotion
          # script or download executable artifacts from the candidate.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.PPE42_REBASE_TOKEN }}
          fetch-depth: 1
          filter: blob:none
      - name: Validate tested commit and promote with a backup
        if: github.event.workflow_run.conclusion == 'success'
        env:
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          test -n "$GH_TOKEN"
          python3 utils/ppe42/rebase_next.py promote --run-id "$CI_RUN" --report "$REPORT"
          cat "$REPORT/manifest.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppe42-promotion-${{ github.run_id }}
          path: ${{ env.REPORT }}/
          if-no-files-found: ignore
          retention-days: 90
