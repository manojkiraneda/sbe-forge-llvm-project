name: Promote PPE42 upstream rebase

on:
  workflow_run:
    workflows: ['PPE42 toolchain']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ppe42-upstream-rebase-controller
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'automation/ppe42-build' ||
       startsWith(github.event.workflow_run.head_branch, 'automation/ppe42-rebase/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.PPE42_REBASE_TOKEN }}
      REPORT: /tmp/ppe42-promotion-${{ github.run_id }}
      HISTORY_REPO: ${{ github.workspace }}/../ppe42-rebase-history.git
    steps:
      - name: Record failed candidate
        if: github.event.workflow_run.conclusion != 'success'
        env:
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Candidate CI did not succeed: $CI_URL. llvm-next remains unchanged." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@v4
        if: github.event.workflow_run.conclusion == 'success'
        with:
          # Always use the trusted controller, never execute a promotion
          # script or download executable artifacts from the candidate.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.PPE42_REBASE_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            utils/ppe42
      - name: Restore rebase Git history
        if: github.event.workflow_run.conclusion == 'success'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.HISTORY_REPO }}/objects
            ${{ env.HISTORY_REPO }}/refs
            ${{ env.HISTORY_REPO }}/packed-refs
          key: ppe42-rebase-history-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ppe42-rebase-history-v1-${{ runner.os }}-
      - name: Initialize runner-local history configuration
        if: github.event.workflow_run.conclusion == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 utils/ppe42/rebase_next.py initialize --repo "$HISTORY_REPO"
      - name: Validate tested commit and promote with a backup
        if: github.event.workflow_run.conclusion == 'success'
        env:
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          test -n "$GH_TOKEN"
          python3 utils/ppe42/rebase_next.py promote --repo "$HISTORY_REPO" --run-id "$CI_RUN" --report "$REPORT"
          cat "$REPORT/manifest.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppe42-promotion-${{ github.run_id }}
          path: ${{ env.REPORT }}/
          if-no-files-found: ignore
          retention-days: 90
