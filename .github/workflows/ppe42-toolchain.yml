name: PPE42 toolchain

on:
  pull_request:
    paths:
      - 'llvm/**'
      - 'clang/**'
      - 'lld/**'
      - 'lldb/**'
      - 'compiler-rt/lib/builtins/ppc/**'
      - 'utils/ppe42/build-toolchain.sh'
      - 'utils/ppe42/toolchain-tests.sh'
      - 'utils/ppe42/toolchain-environment.sh'
      - 'utils/ppe42/test_build_toolchain.py'
      - 'utils/ppe42/package_darwin.py'
      - 'utils/ppe42/test_package_darwin.py'
      - '.github/workflows/ppe42-toolchain.yml'
      - '.github/ppe42-toolchain-manifest.json'
  push:
    branches: ['ppe42/llvm-21']
    tags: ['ppe42-toolchain-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppe42-toolchain-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_DIR: build/ppe42
  PACKAGE_DIR: package/ppe42-toolchain

jobs:
  build-package-integration:
    name: Build and test (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            host_arch: x86_64
            runner: ubuntu-24.04
            cache_suffix: '-clang-linux-x86_64'
            host_compiler: clang
            container: ''
          - host: linux-aarch64
            host_arch: aarch64
            runner: ubuntu-24.04-arm
            cache_suffix: '-clang-fedora45-linux-aarch64'
            host_compiler: clang
            container: fedora:45
          - host: darwin-arm64
            host_arch: arm64
            runner: macos-latest
            cache_suffix: '-darwin-arm64'
            host_compiler: system
            container: ''
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      ASSET_NAME: sbe-ppe42-toolchain-${{ matrix.host }}
      SBE_LLVM_SOURCE_DIR: ${{ github.workspace }}
      SBE_LLVM_HOST_COMPILER: ${{ matrix.host_compiler }}
      # Compiler-specific Linux namespaces keep GCC build trees separate.
      # Darwin retains its existing Apple Clang cache.
      CACHE_NAMESPACE: ppe42${{ matrix.cache_suffix }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Bootstrap Fedora checkout tools
        if: matrix.container != ''
        run: |
          dnf install -y git ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out the common development entry point
        uses: actions/checkout@v4
        with:
          repository: manojkiraneda/sbe-forge
          # Pin the entry-point API; compiler sources always come from this job.
          ref: 5ffd836bd030406f0456e84288f30b3a5098a0fd
          path: sbe-forge-integration
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: matrix.container == ''
        with:
          python-version: '3.11'

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.host_arch }}
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase host --expect-arch "$EXPECTED_ARCH"

      - name: Install build and integration dependencies
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase deps

      - name: Test development entry point
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase test-entrypoint

      - name: Test shared build helpers
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase test-unit

      - name: Prepare TensorFlow AOT compiler
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase prepare-tensorflow

      - name: Prepare MLGO inliner model
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase prepare-model

      - name: Restore compiler object cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CACHE_NAMESPACE }}-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_NAMESPACE }}-ccache-${{ runner.os }}-

      - name: Restore CMake and Ninja build tree
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: ${{ env.CACHE_NAMESPACE }}-mlgo-build-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_NAMESPACE }}-mlgo-build-v1-${{ runner.os }}-

      - name: Record compiler cache configuration
        id: cache-stats
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase cache-start

      - name: Configure
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase configure

      - name: Build embedded MLGO dependencies first
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase build-deps

      - name: Incrementally build required tools
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase build

      - name: Report compiler cache hits and misses
        if: always() && steps.cache-stats.outcome == 'success'
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase cache-report

      - name: Build PPE42 compiler runtime
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase runtime

      - name: Test compiler regressions
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase test-compiler

      - name: Stage minimal toolchain
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase stage

      - name: Check packaged toolchain
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase check

      - name: Test packaged cores, linking and host architecture
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase test-package

      - name: Test candidate toolchain against SBE Forge
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase firmware

      - name: Test development container with the candidate toolchain
        if: matrix.host == 'linux-x86_64'
        run: ./sbe-forge-integration/scripts/dev.sh --container --phase check

      - name: Create toolchain package
        run: ./sbe-forge-integration/scripts/dev.sh --native --phase archive

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}-${{ github.sha }}
          path: |
            ${{ env.ASSET_NAME }}.tar.zst
            ${{ env.ASSET_NAME }}.tar.zst.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Attest tagged package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET_NAME }}.tar.zst

      - name: Save CMake and Ninja build tree
        if: always() && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: ${{ env.CACHE_NAMESPACE }}-mlgo-build-v1-${{ runner.os }}-${{ github.sha }}

      - name: Save compiler object cache
        if: always() && steps.ccache.outcome == 'success' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CACHE_NAMESPACE }}-ccache-${{ runner.os }}-${{ github.sha }}

  publish-release:
    name: Publish all host toolchains
    needs: build-package-integration
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested host packages
        uses: actions/download-artifact@v4
        with:
          pattern: sbe-ppe42-toolchain-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: release-assets
        run: |
          for host in linux-x86_64 linux-aarch64 darwin-arm64; do
            test -f "sbe-ppe42-toolchain-$host.tar.zst"
            sha256sum --check "sbe-ppe42-toolchain-$host.tar.zst.sha256"
          done
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tar.zst ./*.tar.zst.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              ./*.tar.zst ./*.tar.zst.sha256 \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
