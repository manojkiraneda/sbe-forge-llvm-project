name: PPE42 toolchain

on:
  pull_request:
    paths:
      - 'llvm/**'
      - 'clang/**'
      - 'lld/**'
      - '.github/workflows/ppe42-toolchain.yml'
  push:
    branches: ['ppe42/llvm-21']
    tags: ['ppe42-toolchain-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppe42-toolchain-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_DIR: build/ppe42
  PACKAGE_DIR: package/ppe42-toolchain
  ASSET_NAME: sbe-ppe42-toolchain-linux-x86_64

jobs:
  build-package-integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build and integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache cmake ninja-build meson rustup zstd
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add powerpc-unknown-linux-gnu

      - name: Prepare MLGO inliner model and TensorFlow AOT compiler
        run: |
          python -m pip install 'tensorflow==2.15.1'
          mkdir -p "$RUNNER_TEMP/ppe42-mlgo"
          curl --fail --location --retry 3 \
            https://github.com/google/ml-compiler-opt/releases/download/inlining-Oz-v1.1/inlining-Oz-99f0063-v1.1.tar.gz \
            --output "$RUNNER_TEMP/ppe42-mlgo/inliner.tar.gz"
          printf '%s  %s\n' \
            308e5fbe2c4382d6f9c154c7afbea46624dac32b95609144ba1160836e906cd2 \
            "$RUNNER_TEMP/ppe42-mlgo/inliner.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ppe42-mlgo/inliner.tar.gz" \
            -C "$RUNNER_TEMP/ppe42-mlgo"
          test -f "$RUNNER_TEMP/ppe42-mlgo/model/saved_model.pb"
          printf 'MLGO_MODEL_PATH=%s\n' "$RUNNER_TEMP/ppe42-mlgo/model" >> "$GITHUB_ENV"

      - name: Restore compiler object cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ppe42-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ppe42-ccache-${{ runner.os }}-

      - name: Restore CMake and Ninja build tree
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: ppe42-mlgo-build-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ppe42-mlgo-build-v1-${{ runner.os }}-

      - name: Configure
        run: |
          tensorflow_aot_path="$(python -c 'import os, tensorflow; print(os.path.dirname(tensorflow.__file__))')"
          cmake -S llvm -B "$BUILD_DIR" -G Ninja \
            -DLLVM_ENABLE_PROJECTS='clang;lld' \
            -DLLVM_TARGETS_TO_BUILD=PowerPC \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_CCACHE_BUILD=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCLANG_LINK_CLANG_DYLIB=OFF \
            -DTENSORFLOW_AOT_PATH="$tensorflow_aot_path" \
            -DTENSORFLOW_AOT_COMPILER="$(command -v saved_model_cli)" \
            -DLLVM_INLINER_MODEL_PATH="$MLGO_MODEL_PATH" \
            -DLLVM_RAEVICT_MODEL_PATH=none \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/ppe42-toolchain"

      - name: Incrementally build required tools
        run: |
          cmake --build "$BUILD_DIR" --target \
            clang lld llc opt llvm-ar llvm-objcopy llvm-objdump llvm-nm \
            llvm-mc llvm-readobj llvm-config FileCheck split-file not count

      - name: Test embedded MLGO inliner
        run: |
          cat > "$RUNNER_TEMP/ppe42-mlgo/smoke.c" <<'EOF'
          static int helper(int value) { return value + 1; }
          int entry(int value) { return helper(value); }
          EOF
          "$BUILD_DIR/bin/clang" -target powerpc-unknown-elf -mcpu=ppe42 \
            -Oz -mllvm -enable-ml-inliner=release \
            -c "$RUNNER_TEMP/ppe42-mlgo/smoke.c" \
            -o "$RUNNER_TEMP/ppe42-mlgo/smoke.o"
          "$BUILD_DIR/bin/llvm-readobj" --file-headers \
            "$RUNNER_TEMP/ppe42-mlgo/smoke.o" | grep -q 'Machine: EM_PPC'

      - name: Test PowerPC small-data relocations
        run: |
          "$BUILD_DIR/bin/llvm-lit" -v \
            llvm/test/MC/PowerPC/ppc32-sda21.s \
            llvm/test/MC/PowerPC/ppc32-sda21-invalid.s \
            llvm/test/CodeGen/PowerPC/sdata-limit.ll \
            clang/test/Driver/ppc-sdata.c \
            lld/test/ELF/ppc32-sda21.s \
            lld/test/ELF/ppc32-sda21-invalid.s

      - name: Test PPE42 fused compare-and-branch instructions
        run: |
          "$BUILD_DIR/bin/llvm-lit" -v \
            llvm/test/MC/PowerPC/ppe42-fused-compare-branch.s \
            llvm/test/MC/PowerPC/ppe42-fused-compare-branch-invalid.s \
            llvm/test/CodeGen/PowerPC/ppe42-bit-branch.mir \
            llvm/test/CodeGen/PowerPC/ppe42-immediate-compare-branch.mir

      - name: Test PPE42 size-aware inlining
        run: |
          "$BUILD_DIR/bin/llvm-lit" -v \
            llvm/test/Transforms/Inline/PowerPC/ppe42-size-shared-asm.ll \
            llvm/test/Transforms/Inline/PowerPC/ppe42-size-shared-wide.ll \
            llvm/test/Transforms/Inline/PowerPC/ppe42-size-retained-helper.ll

      - name: Test PPE42 inline assembly register pairs
        run: |
          "$BUILD_DIR/bin/llvm-lit" -v \
            llvm/test/CodeGen/PowerPC/ppe42-inline-asm-vdr.ll \
            llvm/test/CodeGen/PowerPC/ppe42-inline-asm-pairs.ll \
            llvm/test/CodeGen/PowerPC/ppe42-vdr-copy.mir \
            llvm/test/CodeGen/PowerPC/ppe42-pre-ra-stvd-pairs.mir \
            llvm/test/CodeGen/PowerPC/ppe42-lvd-load-pairs.mir

      - name: Test PPE42 stack option
        run: |
          "$BUILD_DIR/bin/llvm-lit" -v \
            llvm/test/CodeGen/PowerPC/ppe42-stack-ops.ll \
            clang/test/Driver/ppc-ppe42x-stack.c

      - name: Build PPE42 compiler runtime
        run: |
          mkdir -p "$BUILD_DIR/ppe42-runtime"
          for width in 32 64; do
            "$BUILD_DIR/bin/clang" -target powerpc-unknown-elf -mcpu=ppe42 \
              -c "compiler-rt/lib/builtins/ppc/ppe42-div${width}.S" \
              -o "$BUILD_DIR/ppe42-runtime/ppe42-div${width}.o"
          done
          cmake -E rm -f "$BUILD_DIR/ppe42-runtime/libclang_rt.ppe42.a"
          "$BUILD_DIR/bin/llvm-ar" rcs \
            "$BUILD_DIR/ppe42-runtime/libclang_rt.ppe42.a" \
            "$BUILD_DIR/ppe42-runtime/ppe42-div32.o" \
            "$BUILD_DIR/ppe42-runtime/ppe42-div64.o"
          "$BUILD_DIR/bin/llvm-nm" --defined-only \
            "$BUILD_DIR/ppe42-runtime/libclang_rt.ppe42.a" | \
            "$BUILD_DIR/bin/FileCheck" \
              compiler-rt/test/builtins/ppc/ppe42-div-symbols.txt

      - name: Stage minimal toolchain
        run: |
          mkdir -p "$PACKAGE_DIR/bin" "$PACKAGE_DIR/lib/clang"
          mkdir -p "$PACKAGE_DIR/lib/ppe42"
          mkdir -p "$PACKAGE_DIR/share/mlgo/inliner-oz-v1.1" \
            "$PACKAGE_DIR/share/doc"
          for tool in clang ld.lld llvm-ar llvm-objcopy llvm-objdump llvm-nm; do
            cp --dereference "$BUILD_DIR/bin/$tool" "$PACKAGE_DIR/bin/$tool"
            strip "$PACKAGE_DIR/bin/$tool"
          done
          ln -s clang "$PACKAGE_DIR/bin/clang++"

          resource_dir="$("$BUILD_DIR/bin/clang" --print-resource-dir)"
          cp -a "$resource_dir" "$PACKAGE_DIR/lib/clang/"
          cp "$BUILD_DIR/ppe42-runtime/libclang_rt.ppe42.a" \
            "$PACKAGE_DIR/lib/ppe42/"
          cp -a "$MLGO_MODEL_PATH/." \
            "$PACKAGE_DIR/share/mlgo/inliner-oz-v1.1/"
          cp llvm/docs/PPE42MLGO.rst "$PACKAGE_DIR/share/doc/"

          jq \
            --arg llvm_sha "$GITHUB_SHA" \
            --arg llvm_ref "$GITHUB_REF_NAME" \
            '.llvm_sha = $llvm_sha | .llvm_ref = $llvm_ref |
             .mlgo = {"inliner_model": "inlining-Oz-v1.1",
                      "mode": "embedded-aot",
                      "activation": "-mllvm -enable-ml-inliner=release",
                      "source_model": "share/mlgo/inliner-oz-v1.1"}' \
            .github/ppe42-toolchain-manifest.json \
            > "$PACKAGE_DIR/manifest.json"

          du -sh "$PACKAGE_DIR"
          find "$PACKAGE_DIR" -maxdepth 3 -type f -printf '%s %p\n' | sort -nr

          "$PACKAGE_DIR/bin/clang++" --version
          "$PACKAGE_DIR/bin/clang" -target powerpc-unknown-elf -mcpu=ppe42 \
            -Oz -mllvm -enable-ml-inliner=release \
            -c "$RUNNER_TEMP/ppe42-mlgo/smoke.c" \
            -o "$RUNNER_TEMP/ppe42-mlgo/packaged-smoke.o"
          if ldd "$PACKAGE_DIR/bin/clang" | grep -q 'not found'; then
            echo 'Packaged clang has a missing shared-library dependency' >&2
            exit 1
          fi

      - name: Test candidate toolchain against SBE Forge
        env:
          SBE_FORGE_REPOSITORY: ${{ vars.SBE_FORGE_REPOSITORY || 'manojkiraneda/sbe-forge' }}
        run: |
          git clone --depth 1 "https://github.com/${SBE_FORGE_REPOSITORY}.git" sbe-forge-integration
          SBE_LLVM_INSTALL_DIR="$GITHUB_WORKSPACE/$PACKAGE_DIR" \
            sbe-forge-integration/scripts/test-firmware.sh

      - name: Create toolchain package
        run: |
          tar --zstd -C package -cf "$ASSET_NAME.tar.zst" ppe42-toolchain
          sha256sum "$ASSET_NAME.tar.zst" > "$ASSET_NAME.tar.zst.sha256"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}-${{ github.sha }}
          path: |
            ${{ env.ASSET_NAME }}.tar.zst
            ${{ env.ASSET_NAME }}.tar.zst.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ASSET_NAME.tar.zst" \
            "$ASSET_NAME.tar.zst.sha256" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

      - name: Attest tagged package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET_NAME }}.tar.zst

      - name: Save CMake and Ninja build tree
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: ppe42-mlgo-build-v1-${{ runner.os }}-${{ github.sha }}

      - name: Save compiler object cache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ppe42-ccache-${{ runner.os }}-${{ github.sha }}
