name: PPE42 toolchain

on:
  pull_request:
    paths:
      - 'llvm/**'
      - 'clang/**'
      - 'lld/**'
      - '.github/workflows/ppe42-toolchain.yml'
  push:
    branches: ['ppe42/llvm-21']
    tags: ['ppe42-toolchain-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppe42-toolchain-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_DIR: build/ppe42
  PACKAGE_DIR: package/ppe42-toolchain
  ASSET_NAME: sbe-ppe42-toolchain-linux-x86_64

jobs:
  build-package-integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build and integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache cmake ninja-build meson zstd

      - name: Restore compiler object cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ppe42-ccache-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ppe42-ccache-v2-${{ runner.os }}-

      - name: Restore CMake and Ninja build tree
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: ppe42-build-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ppe42-build-v1-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S llvm -B "$BUILD_DIR" -G Ninja \
            -DLLVM_ENABLE_PROJECTS='clang;lld' \
            -DLLVM_TARGETS_TO_BUILD=PowerPC \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_CCACHE_BUILD=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCLANG_LINK_CLANG_DYLIB=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/ppe42-toolchain"

      - name: Incrementally build required tools
        run: |
          cmake --build "$BUILD_DIR" --target \
            clang lld llvm-ar llvm-objcopy llvm-objdump llvm-nm \
            llvm-mc llvm-readobj llvm-config FileCheck split-file not count

      - name: Test PowerPC small-data relocations
        run: |
          "$BUILD_DIR/bin/llvm-lit" -v \
            llvm/test/MC/PowerPC/ppc32-sda21.s \
            llvm/test/MC/PowerPC/ppc32-sda21-invalid.s \
            lld/test/ELF/ppc32-sda21.s \
            lld/test/ELF/ppc32-sda21-invalid.s

      - name: Test PPE42 fused compare-and-branch instructions
        run: |
          "$BUILD_DIR/bin/llvm-lit" -v \
            llvm/test/MC/PowerPC/ppe42-fused-compare-branch.s \
            llvm/test/MC/PowerPC/ppe42-fused-compare-branch-invalid.s

      - name: Build PPE42 compiler runtime
        run: |
          mkdir -p "$BUILD_DIR/ppe42-runtime"
          for width in 32 64; do
            "$BUILD_DIR/bin/clang" -target powerpc-unknown-elf -mcpu=ppe42 \
              -c "compiler-rt/lib/builtins/ppc/ppe42-div${width}.S" \
              -o "$BUILD_DIR/ppe42-runtime/ppe42-div${width}.o"
          done
          cmake -E rm -f "$BUILD_DIR/ppe42-runtime/libclang_rt.ppe42.a"
          "$BUILD_DIR/bin/llvm-ar" rcs \
            "$BUILD_DIR/ppe42-runtime/libclang_rt.ppe42.a" \
            "$BUILD_DIR/ppe42-runtime/ppe42-div32.o" \
            "$BUILD_DIR/ppe42-runtime/ppe42-div64.o"
          "$BUILD_DIR/bin/llvm-nm" --defined-only \
            "$BUILD_DIR/ppe42-runtime/libclang_rt.ppe42.a" | \
            "$BUILD_DIR/bin/FileCheck" \
              compiler-rt/test/builtins/ppc/ppe42-div-symbols.txt

      - name: Stage minimal toolchain
        run: |
          mkdir -p "$PACKAGE_DIR/bin" "$PACKAGE_DIR/lib/clang"
          mkdir -p "$PACKAGE_DIR/lib/ppe42"
          for tool in clang ld.lld llvm-ar llvm-objcopy llvm-objdump llvm-nm; do
            cp --dereference "$BUILD_DIR/bin/$tool" "$PACKAGE_DIR/bin/$tool"
            strip "$PACKAGE_DIR/bin/$tool"
          done

          resource_dir="$("$BUILD_DIR/bin/clang" --print-resource-dir)"
          cp -a "$resource_dir" "$PACKAGE_DIR/lib/clang/"
          cp "$BUILD_DIR/ppe42-runtime/libclang_rt.ppe42.a" \
            "$PACKAGE_DIR/lib/ppe42/"

          jq \
            --arg llvm_sha "$GITHUB_SHA" \
            --arg llvm_ref "$GITHUB_REF_NAME" \
            '.llvm_sha = $llvm_sha | .llvm_ref = $llvm_ref' \
            .github/ppe42-toolchain-manifest.json \
            > "$PACKAGE_DIR/manifest.json"

          du -sh "$PACKAGE_DIR"
          find "$PACKAGE_DIR" -maxdepth 3 -type f -printf '%s %p\n' | sort -nr

      - name: Test candidate toolchain against SBE Forge
        env:
          SBE_FORGE_REPOSITORY: ${{ vars.SBE_FORGE_REPOSITORY || 'manojkiraneda/sbe-forge' }}
        run: |
          git clone --depth 1 "https://github.com/${SBE_FORGE_REPOSITORY}.git" sbe-forge-integration
          SBE_LLVM_INSTALL_DIR="$GITHUB_WORKSPACE/$PACKAGE_DIR" \
            sbe-forge-integration/scripts/test-firmware.sh

      - name: Create toolchain package
        run: |
          tar --zstd -C package -cf "$ASSET_NAME.tar.zst" ppe42-toolchain
          sha256sum "$ASSET_NAME.tar.zst" > "$ASSET_NAME.tar.zst.sha256"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}-${{ github.sha }}
          path: |
            ${{ env.ASSET_NAME }}.tar.zst
            ${{ env.ASSET_NAME }}.tar.zst.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ASSET_NAME.tar.zst" \
            "$ASSET_NAME.tar.zst.sha256" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

      - name: Attest tagged package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET_NAME }}.tar.zst

      - name: Save CMake and Ninja build tree
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: ppe42-build-v2-${{ runner.os }}-${{ github.sha }}

      - name: Save compiler object cache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ppe42-ccache-v2-${{ runner.os }}-${{ github.sha }}
